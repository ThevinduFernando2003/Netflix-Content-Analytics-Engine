name: Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    env:
      ENRICHMENT_ENABLED: "false"
      INSIGHT_LLM_POLISH: "false"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pipeline extras
        run: pip install -r requirements-dev.txt
      - name: Run full pipeline
        run: python scripts/run_pipeline.py --force
      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: reports
      - name: Comment leaderboard
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Leaderboard written to reports/model_leaderboard.md"
          head -n 80 reports/model_leaderboard.md
